# ========================
# APPLICATION CONFIGURATION
# ========================
spring.application.name=credit-scoring-system
google.client-id=${GOOGLE_CLIENT_ID}
# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/credit_scoring?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============
# JWT
# ============
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# =============
# SWAGGER
# =============
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.document.upload-dir=./uploads/documents

# ========================
# SQL INIT
# ========================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ========================
# SERVER
# ========================
server.port=8082

# ========================
# GMAIL CONFIGURATION
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.enabled=true

# ========================
# CREDIT CONFIG
# ========================
app.credit.taux-interet-defaut=7.5
app.credit.penalite-pourcentage-jour=0.5
app.credit.penalite-max-pourcentage=10.0

# ========================
# AUTHORIZATION LIMITS
# ========================
app.autorisation.conseiller=30000
app.autorisation.responsable=150000

# ========================
# SCHEDULING
# ========================
spring.task.scheduling.pool.size=5

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.application.name=Credit Scoring System
info.application.version=1.0
info.application.description=Plateforme intelligente de Credit Scoring
info.application.author=Takwa

# ======================================================
# GOOGLE OAUTH2
# ======================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE